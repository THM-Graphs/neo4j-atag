name: publish-docs

on:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: publish-docs
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: generate maven site
        run: mvn -B site site:stage --no-transfer-progress

      - name: Set git user for SCM publishing
        run: |
          git config --global user.email "github-actions@users.noreply.github.com"
          git config --global user.name "github-actions"

      - name: Set authenticated git remote
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global http.https://github.com/.extraheader "Authorization: basic $(echo -n "x-access-token:${GITHUB_TOKEN}" | base64 -w 0)"

      - name: publish to gh-pages
        run: mvn -B scm-publish:publish-scm --no-transfer-progress
