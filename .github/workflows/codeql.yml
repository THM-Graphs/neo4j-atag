name: codeql

on:
  push:
    branches: [ main ]
  pull_request:
  schedule:
    - cron: '0 5 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'
      - uses: github/codeql-action/init@915412ff23e8b7659517e607487dbeae018f2934 # v4
        with:
          languages: java-kotlin
          build-mode: manual
      - run: mvn -B package -DskipTests --no-transfer-progress
      - uses: github/codeql-action/analyze@915412ff23e8b7659517e607487dbeae018f2934 # v4
