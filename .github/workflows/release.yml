name: release

# Pushing a tag vX.Y.Z releases that version, see docs/adr/0009-tag-driven-release.md
on:
  push:
    tags: [ 'v[0-9]+.[0-9]+.[0-9]+' ]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Tag must be on main
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::$GITHUB_REF_NAME is not reachable from main"; exit 1; }
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'
      - name: Set Maven version to the tag
        run: mvn -B versions:set "-DnewVersion=$GITHUB_REF_NAME" -DgenerateBackupPoms=false --no-transfer-progress
      - run: mvn -B verify --no-transfer-progress

  release:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'
      - name: Set Maven version to the tag
        run: mvn -B versions:set "-DnewVersion=$GITHUB_REF_NAME" -DgenerateBackupPoms=false --no-transfer-progress
      - name: Publish package
        run: mvn -B clean deploy -DskipTests --no-transfer-progress
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        with:
          generate_release_notes: true
          files: target/neo4j-atag-*.jar

  docs:
    needs: release
    permissions:
      contents: write
    uses: ./.github/workflows/publish-docs.yml
